<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4f8a" />
    <!-- RideProof has its own light and dark designs. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Track your Medicaid medical rides, catch problems, and prove when rides fail." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Lets iPhones open the installed app full-screen, like a native app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RideProof" />
    <title>RideProof</title>
  </head>
  <body>
    <div id="root">
      <!--
        Shown only if the app fails to start (React replaces it as soon as it
        runs). The styles are written right here, because if the app didn't
        load, the app's own styles may not have loaded either.
      -->
      <div style="font-family: system-ui, sans-serif; font-size: 18px; line-height: 1.5; padding: 24px; color: #1a1a1a; background: #ffffff; position: fixed; inset: 0; overflow: auto;">
        <p style="font-weight: 700; font-size: 22px; margin-top: 0;">RideProof is starting…</p>
        <p>If this message doesn't go away, the app couldn't start. Try reloading the page.</p>
        <p style="color: #4a4a4a;">For the person setting up the website: make sure the build command is
          <code>npm run build</code> and the output folder is <code>dist</code>.</p>
      </div>
    </div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; font-size: 18px; padding: 24px;">RideProof needs JavaScript turned on.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
